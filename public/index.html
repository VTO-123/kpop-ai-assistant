<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>K-POP 档案室 · 移动粉丝版</title>
    <meta name="description" content="移动端粉丝版 K-POP 档案室：搜索/发现你喜欢的团体，生成专属档案，收藏你的本命。" />
    <meta name="theme-color" content="#0b0b12" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="K-POP 档案室" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/mobile.css" />
  </head>
  <body class="app-body">
    <div id="app" class="app">
      <header class="app-bar" id="appBar">
        <div class="app-bar__brand">
          <span class="brand-mark" aria-hidden="true">K</span>
          <span class="brand-text">
            <strong>K-POP 档案室</strong>
            <small>我的追星站</small>
          </span>
        </div>
        <span class="mode-badge" id="modeBadge" hidden>
          <i class="mode-dot" id="modeDot" aria-hidden="true"></i>
          <span id="modeText">检测中…</span>
        </span>
      </header>

      <main class="view" id="view" aria-live="polite"></main>

      <nav class="tabbar" aria-label="主导航">
        <button class="tab" data-view="home" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>
          <span>发现</span>
        </button>
        <button class="tab" data-view="hot" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3l-2 6h5l-3 7h2L8 21l1-6H4l3-7h6z"/></svg>
          <span>热门</span>
        </button>
        <button class="tab" data-view="mine" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 10-5-5 5 5 0 005 5zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5z"/></svg>
          <span>我的</span>
        </button>
      </nav>
    </div>

    <div class="toast" id="toast" hidden></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
